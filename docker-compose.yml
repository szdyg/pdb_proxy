version: "3"

networks:
  pdb_proxy:
    external: false

services:
  server:
    image: szdyg/pdb_proxy
    environment:
      - TIME_ZONE=Asia/Shanghai
      - PDB_SERVER=https://msdl.microsoft.com/download/symbols
      - PDB_CACHE_TTL=${PDB_CACHE_TTL:-1h}
    restart: always
    networks:
      - pdb_proxy
    volumes:
      - ./pdb:/opt/pdb

    ports:
      - "9000:9000"
